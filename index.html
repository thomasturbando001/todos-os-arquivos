<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todos os Arquivos — Visualizador Automático</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #e6edf3;
      --accent: #58a6ff;
      --shadow: rgba(0,0,0,0.4);
    }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px;
    }
    h1, h2 {
      color: var(--accent);
      text-align: center;
    }
    .folder {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 8px var(--shadow);
      cursor: pointer;
      transition: 0.3s;
    }
    .folder:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 14px var(--shadow);
    }
    .files {
      margin-left: 20px;
      margin-top: 10px;
      display: none;
    }
    .file {
      padding: 6px 0;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .file span {
      font-family: monospace;
      font-size: 0.95em;
    }
    button {
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.85em;
      transition: background 0.2s;
      margin-left: 8px;
    }
    button:hover {
      background: #1f6feb;
    }
    footer {
      text-align: center;
      font-size: 0.9em;
      margin-top: 40px;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h1>📁 Todos os Arquivos — Projetos e Exercícios</h1>
  <p style="text-align:center;">Clique em uma pasta para ver os arquivos e testar ou visualizar o código.</p>

  <div id="folders"></div>

  <footer>
    <p>Site hospedado em <a href="https://thomasturbando001.github.io/todos-os-arquivos/" style="color:var(--accent)">GitHub Pages</a></p>
  </footer>

  <script>
    const repo = "thomasturbando001/todos-os-arquivos";
    const baseUrl = "https://thomasturbando001.github.io/todos-os-arquivos/";
    const folders = [
      "JOGO DE 2D",
      "Project Python/Project Python",
      "back",
      "jogo de 3d",
      "num sei"
    ];

    const container = document.getElementById("folders");

    folders.forEach(folder => {
      const div = document.createElement("div");
      div.className = "folder";
      div.innerHTML = `<strong>📂 ${folder}</strong><div class="files"></div>`;
      container.appendChild(div);

      div.addEventListener("click", async () => {
        const filesDiv = div.querySelector(".files");
        if (filesDiv.style.display === "block") {
          filesDiv.style.display = "none";
          filesDiv.innerHTML = "";
          return;
        }

        filesDiv.innerHTML = "<em>Carregando...</em>";
        filesDiv.style.display = "block";

        const apiUrl = `https://api.github.com/repos/${repo}/contents/${encodeURIComponent(folder)}`;
        try {
          const res = await fetch(apiUrl);
          const data = await res.json();

          if (!Array.isArray(data)) {
            filesDiv.innerHTML = "<em>Não foi possível listar os arquivos.</em>";
            return;
          }

          filesDiv.innerHTML = "";
          data.forEach(file => {
            const row = document.createElement("div");
            row.className = "file";
            row.innerHTML = `<span>${file.name}</span>`;

            // Se for HTML, adiciona botão "Abrir/Testar"
            if (file.name.endsWith(".html")) {
              const btn = document.createElement("button");
              btn.textContent = "Abrir/Testar";
              btn.onclick = () => {
                const fileUrl = `${baseUrl}${folder}/${file.name}`;
                window.open(fileUrl, "_blank");
              };
              row.appendChild(btn);
            } else {
              // Se não for HTML, adiciona botão "Ver Código"
              const rawBtn = document.createElement("button");
              rawBtn.textContent = "Ver Código";
              rawBtn.onclick = () => {
                const rawUrl = file.download_url; // Link direto via GitHub API
                window.open(rawUrl, "_blank");
              };
              row.appendChild(rawBtn);
            }

            filesDiv.appendChild(row);
          });
        } catch (e) {
          console.error(e);
          filesDiv.innerHTML = "<em>Erro ao carregar arquivos.</em>";
        }
      });
    });
  </script>
</body>
</html>
